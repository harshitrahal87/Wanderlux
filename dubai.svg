  <g fill="#bcd6ea">
    <path d="M470 90 L530 90 L512 300 L488 300 Z"/>
    <path d="M488 300 L512 300 L528 430 L472 430 Z"/>
    <path d="M472 430 L528 430 L548 590 L452 590 Z"/>
  </g>
  <rect x="497" y="30" width="6" height="60" fill="#9db9cf"/>
  <g stroke="#8fb4d0" stroke-width="2" opacity="0.7">
    <path d="M476 330 L524 330"/><path d="M470 380 L530 380"/>
    <path d="M462 470 L538 470"/><path d="M457 520 L543 520"/>
  </g>
  <!-- water -->
