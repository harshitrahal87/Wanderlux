<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="dSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6b25a"/>
      <stop offset="50%" stop-color="#f7d08a"/>
      <stop offset="100%" stop-color="#fdeecb"/>
    </linearGradient>
    <linearGradient id="dBuild" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8db8d8"/>
      <stop offset="100%" stop-color="#5c8bb0"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="640" fill="url(#dSky)"/>
  <circle cx="800" cy="180" r="70" fill="#fff6e0" opacity="0.85"/>
  <!-- skyline -->
  <g fill="url(#dBuild)">
    <rect x="80" y="380" width="60" height="210"/>
    <rect x="160" y="320" width="70" height="270"/>
    <rect x="700" y="350" width="80" height="240"/>
    <rect x="800" y="300" width="60" height="290"/>
    <rect x="880" y="360" width="70" height="230"/>
  </g>
