  <g stroke="#ffffff" stroke-width="3" opacity="0.3" fill="none">
    <path d="M120 595 q 25 -8 50 0 t 50 0"/>
    <path d="M640 600 q 25 -8 50 0 t 50 0"/>
  </g>
