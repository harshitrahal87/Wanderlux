<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4aa3e0"/>
      <stop offset="60%" stop-color="#9fd0f2"/>
      <stop offset="100%" stop-color="#dcefff"/>
    </linearGradient>
    <linearGradient id="sSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3aa0c9"/>
      <stop offset="100%" stop-color="#1f7fa8"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="640" fill="url(#sSky)"/>
  <circle cx="180" cy="150" r="60" fill="#fff8e0" opacity="0.9"/>
  <g fill="#ffffff" opacity="0.6">
    <ellipse cx="600" cy="120" rx="80" ry="18"/>
    <ellipse cx="820" cy="90" rx="60" ry="16"/>
  </g>
  <!-- Harbour Bridge -->
  <g stroke="#5b7085" stroke-width="10" fill="none">
    <path d="M40 430 Q 300 250 560 430"/>
  </g>
  <rect x="40" y="430" width="520" height="12" fill="#5b7085"/>
  <g stroke="#5b7085" stroke-width="4">
    <path d="M120 360 L120 434"/><path d="M200 315 L200 434"/>
    <path d="M300 300 L300 434"/><path d="M400 315 L400 434"/>
    <path d="M480 360 L480 434"/>
  </g>
  <rect x="70" y="420" width="26" height="80" fill="#4a5c6e"/>
  <rect x="500" y="420" width="26" height="80" fill="#4a5c6e"/>
  <!-- Opera House sails -->
  <g fill="#ffffff" stroke="#dbe6ee" stroke-width="2">
    <path d="M620 470 Q 660 340 720 470 Z"/>
    <path d="M680 470 Q 725 320 790 470 Z"/>
    <path d="M760 470 Q 800 350 850 470 Z"/>
    <path d="M820 470 Q 852 380 890 470 Z"/>
  </g>
  <!-- sea -->
  <rect y="470" width="1000" height="170" fill="url(#sSea)"/>
  <g stroke="#ffffff" stroke-width="3" opacity="0.3" fill="none">
    <path d="M120 520 q 25 -8 50 0 t 50 0"/>
    <path d="M700 545 q 25 -8 50 0 t 50 0"/>
  </g>
</svg>
